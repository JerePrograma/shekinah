name: Dux inventory reconciliation

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dux-inventory-reconciliation-production
  cancel-in-progress: false

jobs:
  reconcile:
    name: Refresh production Dux snapshot
    if: ${{ vars.DUX_RECONCILIATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-pages-production
      deployment: false

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version

      - name: Refresh Dux inventory snapshot
        env:
          SHEKINAH_RECONCILE_URL: https://shekinah.ar/api/internal/dux/reconcile
          SHEKINAH_RECONCILE_SECRET: ${{ secrets.DUX_SCHEDULER_SECRET }}
        run: node scripts/run-dux-reconcile.mjs
