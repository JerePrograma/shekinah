name: Publish verified block 2 foundation

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  statuses: write

concurrency:
  group: shekinah-block2-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.title == 'internal-block2-publish-v4-20260724' &&
      github.event.comment.body == 'PUBLISH_BLOCK_2_V4' &&
      github.event.comment.user.login == 'JerePrograma'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout staged main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Verify staging commit
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='e0076931369cebdae007326c8c9e1223814b0213'
          [[ "$(git rev-parse HEAD^)" == "$expected_parent" ]]
          [[ "$(git log -1 --pretty=%s)" == 'chore: stage verified block 2 publisher' ]]
          changed=$(git diff-tree --no-commit-id --name-only -r HEAD)
          [[ "$changed" == '.github/workflows/block2-publisher.yml' ]]
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Reconstruct validated candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/block2-v4"
          mkdir -p "$root"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            > "$root/comments.json"

          ROOT="$root" python <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          root = Path(os.environ["ROOT"])
          pages = json.loads((root / "comments.json").read_text(encoding="utf-8"))
          comments = [item for page in pages for item in page]
          parts = {}
          pattern = re.compile(r"BLOCK2_PART_(\d{2}):\n([A-Za-z0-9+/=]+)\Z")
          for comment in comments:
              if comment.get("user", {}).get("login") != "JerePrograma":
                  continue
              match = pattern.fullmatch(comment.get("body") or "")
              if match:
                  index = int(match.group(1))
                  if index in parts:
                      raise SystemExit(f"Parte duplicada: {index:02d}")
                  parts[index] = match.group(2)

          expected_indexes = list(range(5))
          if sorted(parts) != expected_indexes:
              raise SystemExit(
                  f"Partes incorrectas: obtenidas={sorted(parts)}, esperadas={expected_indexes}"
              )

          encoded = "".join(parts[index] for index in expected_indexes)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = "ab4080dc01c0ced0cc7be9b29ca6fa3dc3cd75fcf4230b621f6d7a67bbe567fa"
          if digest != expected:
              raise SystemExit(f"ZIP incorrecto: {digest}")

          (root / "candidate.zip").write_bytes(archive)
          print(f"Candidato reconstruido: {len(archive)} bytes, sha256={digest}")
          PY

          unzip -q "$root/candidate.zip" -d "$root/unpacked"
          candidate="$root/unpacked/shekinah-block2-candidate"
          test -d "$candidate"
          echo "CANDIDATE_ROOT=$candidate" >> "$GITHUB_ENV"

      - name: Verify exact candidate and run full validation
        shell: bash
        run: |
          set -euo pipefail
          candidate="$CANDIDATE_ROOT"

          CANDIDATE_ROOT="$candidate" python <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["CANDIDATE_ROOT"])
          expected_files = {
              ".editorconfig",
              ".gitattributes",
              ".gitignore",
              ".nvmrc",
              "README.md",
              "docs/REIMPLEMENTATION_PROGRESS.md",
              "docs/validation/BLOCK_2_VALIDATIONS.md",
              "eslint.config.js",
              "index.html",
              "package-lock.json",
              "package.json",
              "playwright.config.ts",
              "public/assets/logo-shekinah.png",
              "scripts/verify-assets.mjs",
              "src/App.test.tsx",
              "src/App.tsx",
              "src/main.tsx",
              "src/styles.css",
              "src/test/setup.ts",
              "src/vite-env.d.ts",
              "tests/e2e/app.spec.ts",
              "tsconfig.json",
              "vite.config.ts",
              "vitest.config.ts",
          }
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          }
          if actual != expected_files:
              raise SystemExit(
                  f"Árbol candidato incorrecto: faltan={sorted(expected_files-actual)}, "
                  f"sobran={sorted(actual-expected_files)}"
              )

          expected_hashes = {
              "public/assets/logo-shekinah.png":
                  "cee7db1812dc39fb9e2a816e8c29bd4922b97752fc4aceae68eabf3985a37747",
              "package-lock.json":
                  "d9ee83f246dccfc14a704f0b2887b6057f99725eff001e32f120461fe217e7dc",
              "vitest.config.ts":
                  "8d83d602ff000af87287049bc469b48dd514a5fe3b6f52cc7290152fb5c4d41d",
              "docs/REIMPLEMENTATION_PROGRESS.md":
                  "0b83ff4c61f55f3424ba9dcbba68b31a465c9c230eaaf94db629b4b43dcd5008",
              "docs/validation/BLOCK_2_VALIDATIONS.md":
                  "a7e6f2835b347d017aef2a2a3b06f7b55329d265219df1c11a77ff26ac971063",
          }
          for relative, expected in expected_hashes.items():
              digest = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              if digest != expected:
                  raise SystemExit(f"Hash incorrecto para {relative}: {digest}")
          print(f"Árbol candidato exacto verificado: {len(actual)} archivos.")
          PY

          cd "$candidate"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run verify

          git init --quiet
          git config user.name 'Shekinah Remote Validation'
          git config user.email 'validation@local.invalid'
          git add --all
          git diff --cached --check
          npm ls --depth=0
          rm -rf .git node_modules dist test-results playwright-report

      - name: Replace tracked tree with validated foundation
        id: foundation
        shell: bash
        run: |
          set -euo pipefail
          staging_sha=$(git rev-parse HEAD)
          candidate="$CANDIDATE_ROOT"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$candidate"/. .
          git add -A
          git diff --cached --check

          python <<'PY'
          import subprocess

          expected = {
              ".editorconfig",
              ".gitattributes",
              ".gitignore",
              ".nvmrc",
              "README.md",
              "docs/REIMPLEMENTATION_PROGRESS.md",
              "docs/validation/BLOCK_2_VALIDATIONS.md",
              "eslint.config.js",
              "index.html",
              "package-lock.json",
              "package.json",
              "playwright.config.ts",
              "public/assets/logo-shekinah.png",
              "scripts/verify-assets.mjs",
              "src/App.test.tsx",
              "src/App.tsx",
              "src/main.tsx",
              "src/styles.css",
              "src/test/setup.ts",
              "src/vite-env.d.ts",
              "tests/e2e/app.spec.ts",
              "tsconfig.json",
              "vite.config.ts",
              "vitest.config.ts",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "ls-files", "--cached"], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"Índice final incorrecto: faltan={sorted(expected-actual)}, "
                  f"sobran={sorted(actual-expected)}"
              )
          PY

          npm ci --no-audit --no-fund
          npm run verify

          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$staging_sha" ]]
          git config user.name 'JerePrograma'
          git config user.email '95102411+JerePrograma@users.noreply.github.com'
          git commit -m 'chore: replace legacy tree with clean React foundation'
          foundation_sha=$(git rev-parse HEAD)
          git push origin HEAD:main
          git fetch origin main
          [[ "$foundation_sha" == "$(git rev-parse origin/main)" ]]
          echo "sha=$foundation_sha" >> "$GITHUB_OUTPUT"

      - name: Record successful block 2 publication
        id: documentation
        shell: bash
        env:
          FOUNDATION_SHA: ${{ steps.foundation.outputs.sha }}
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          from pathlib import Path
          import textwrap

          foundation_sha = os.environ["FOUNDATION_SHA"]
          progress = Path("docs/REIMPLEMENTATION_PROGRESS.md")
          text = progress.read_text(encoding="utf-8")
          text = text.replace(
              "Resultado actual: en curso; la base todavía no fue publicada.",
              "Resultado actual: completado; la base técnica nueva fue publicada."
          )
          text = text.replace(
              "Estado: preparada; validación local pendiente.",
              "Estado: validada y publicada."
          )
          text += textwrap.dedent(f"""

          ### Publicación remota del BLOQUE 2

          Resultado: verificado y publicado.

          - ZIP candidato validado: `ab4080dc01c0ced0cc7be9b29ca6fa3dc3cd75fcf4230b621f6d7a67bbe567fa`
          - ZIP de resultados local: `bb61e9a685533c4fe19fe7588bbce7f3fe35c1d3cf62c9d4a4545aac97e3ac53`
          - Node.js local: `24.18.0`
          - npm local: `11.16.0`
          - `npm ci`: aprobado
          - `npm run verify`: aprobado
          - `git diff --cached --check`: aprobado
          - `npm ls --depth=0`: aprobado
          - Commit de sustitución: `{foundation_sha}`

          El commit de sustitución contiene la base técnica validada y conserva el historial Git anterior.
          """)
          lines = [line.rstrip() for line in text.splitlines()]
          progress.write_text("\n".join(lines).strip() + "\n", encoding="utf-8")

          validation = Path("docs/validation/BLOCK_2_VALIDATIONS.md")
          value = validation.read_text(encoding="utf-8")
          value = value.replace(
              "Estado: preparada y pendiente de validación local completa.",
              "Estado: validada y publicada."
          )
          value += textwrap.dedent(f"""

          ## Resultado final de la candidata v4

          - Resultado local: `SUCCESS`
          - ZIP de resultados: `bb61e9a685533c4fe19fe7588bbce7f3fe35c1d3cf62c9d4a4545aac97e3ac53`
          - `npm ci`: aprobado
          - `npm run verify`: aprobado
          - `git diff --cached --check`: aprobado
          - `npm ls --depth=0`: aprobado
          - Commit de sustitución: `{foundation_sha}`

          La publicación se realizó mediante fast-forward sobre `main`, sin force-push ni reescritura del historial.
          """)
          lines = [line.rstrip() for line in value.splitlines()]
          validation.write_text("\n".join(lines).strip() + "\n", encoding="utf-8")
          PY

          git diff --check
          npm run verify
          git add docs/REIMPLEMENTATION_PROGRESS.md \
            docs/validation/BLOCK_2_VALIDATIONS.md
          git diff --cached --check
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$FOUNDATION_SHA" ]]
          git commit -m 'docs: record successful block 2 publication'
          documentation_sha=$(git rev-parse HEAD)
          git push origin HEAD:main
          git fetch origin main
          [[ "$documentation_sha" == "$(git rev-parse origin/main)" ]]
          echo "sha=$documentation_sha" >> "$GITHUB_OUTPUT"

      - name: Publish result and close issue
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FOUNDATION_SHA: ${{ steps.foundation.outputs.sha }}
          DOCUMENTATION_SHA: ${{ steps.documentation.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${DOCUMENTATION_SHA}" \
            -f state='success' \
            -f context='shekinah/block-2-publication' \
            -f description='Block 2 foundation validated and published' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

          body=$(cat <<EOF
          BLOQUE 2 publicado correctamente.

          - Commit de base técnica: ${FOUNDATION_SHA}
          - Commit documental: ${DOCUMENTATION_SHA}
          - Candidato: ab4080dc01c0ced0cc7be9b29ca6fa3dc3cd75fcf4230b621f6d7a67bbe567fa
          - Resultado local: bb61e9a685533c4fe19fe7588bbce7f3fe35c1d3cf62c9d4a4545aac97e3ac53
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$body" >/dev/null
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f state='closed' \
            -f state_reason='completed' >/dev/null
