name: Mercado Libre editorial content

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercadolibre-editorial-production
  cancel-in-progress: false

jobs:
  editorial:
    if: ${{ vars.ML_EDITORIAL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: cloudflare-pages-production
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
      - name: Refresh authorized editorial content
        env:
          SHEKINAH_EDITORIAL_SECRET: ${{ secrets.MERCADO_LIBRE_EDITORIAL_SCHEDULER_SECRET }}
        run: node scripts/run-ml-editorial.mjs
